name: CI Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # every day at 9:00 UTC

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest -m "unit" --disable-warnings -v

      - name: Start FastAPI server
        run: |
          source .venv/bin/activate
          cd src/moovitamix_fastapi
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          echo $! > ../../uvicorn.pid
          cd ../../

      - name: Wait for FastAPI to start
        run: |
          for i in {1..10}; do
            if curl --silent http://localhost:8000/docs > /dev/null; then
              echo "✅ FastAPI is up!"
              break
            fi
            echo "⏳ Waiting for FastAPI to start ($i/10)"
            sleep 2
          done

      - name: Run API-dependent tests
        run: |
          source .venv/bin/activate
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest -m "api" --disable-warnings -v

      - name: Stop FastAPI server
        run: |
          if [ -f uvicorn.pid ]; then
            kill $(cat uvicorn.pid)
            echo "🛑 Uvicorn server stopped"
          else
            echo "⚠️ PID file not found"
          fi

  pipeline:
    name: Run ETL Pipeline
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI server
        run: |
          source .venv/bin/activate
          cd src/moovitamix_fastapi
          nohup python -m uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          echo $! > ../../uvicorn.pid
          cd ../../

      - name: Wait for FastAPI to start
        run: |
          for i in {1..10}; do
            if curl --silent http://localhost:8000/docs > /dev/null; then
              echo "✅ FastAPI is up!"
              break
            fi
            echo "⏳ Waiting for FastAPI to start ($i/10)"
            sleep 2
          done

      - name: Run ETL
        run: |
          source .venv/bin/activate
          cd src/data_pipeline
          python run_etl.py

      - name: Inspect SQLite
        run: |
          source .venv/bin/activate
          cd src/data_pipeline
          python debug_sql.py

      - name: Stop FastAPI server
        run: |
          if [ -f uvicorn.pid ]; then
            kill $(cat uvicorn.pid)
            echo "🛑 Uvicorn server stopped"
          else
            echo "⚠️ PID file not found"
          fi
